name: Deploy Staging

on:
  push:
    branches:
      - staging

jobs:
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Publish Clickhouse Connector Image
        run: |
          ./gradlew :airbyte-integrations:connectors:destination-clickhouse:airbyteDocker
          docker tag airbyte/destination-clickhouse:dev ${{ secrets.DOCKER_USERNAME }}/destination-clickhouse:staging
          docker push ${{ secrets.DOCKER_USERNAME }}/destination-clickhouse:staging

  deploy-vps:
    name: Trigger VPS Deployment
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH to VPS & Update Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            echo "Pulling latest staging connector image..."
            docker compose pull
            echo "Re-deploying connector stack..."
            docker compose up -d
            echo "Staging VPS updated successfully!"
