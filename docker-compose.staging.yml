# Airbyte Staging Platform Deployment Stack (Traefik Integrated)
# Put this file on your VPS under: /home/vmxclaw/airbyte-staging/docker-compose.yml

version: '3.8'

services:
  # Airbyte Platform Web UI Reverse Proxy Service
  airbyte-platform-proxy:
    image: alpine/socat
    container_name: airbyte-platform-proxy
    restart: always
    # Socat listens on container port 80 and forwards TCP requests to host gateway IP 172.17.0.1 on port 8010 (abctl Airbyte Platform port)
    command: tcp-listen:80,fork,reuseaddr tcp:172.17.0.1:8010
    networks:
      - traefik

    # Traefik labels to automatically discover, route, and provision SSL for the Airbyte Platform UI!
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.airbyte-platform.rule=Host(`1connector.hub.vn`)"
      - "traefik.http.routers.airbyte-platform.entrypoints=websecure"
      - "traefik.http.routers.airbyte-platform.tls=true"
      # Specifying the internal port of this socat container
      - "traefik.http.services.airbyte-platform.loadbalancer.server.port=80"

networks:
  # Reference your existing Traefik network so this stack can communicate with Traefik
  traefik:
    external: true
